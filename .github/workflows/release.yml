name: Release & Publish to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    name: Build Multi-Platform & Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24.0'
          cache: true

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Multi-Platform Go Binaries
        run: |
          mkdir -p bin
          # Linux AMD64 & ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/niskava-linux-amd64 ./cmd/niskava
          cp bin/niskava-linux-amd64 bin/niskava
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o bin/niskava-linux-arm64 ./cmd/niskava
          # macOS Intel & Apple Silicon
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o bin/niskava-darwin-amd64 ./cmd/niskava
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/niskava-darwin-arm64 ./cmd/niskava
          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/niskava-windows-amd64.exe ./cmd/niskava
          chmod +x bin/niskava* bin/index.js

      - name: Publish GitHub Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF_NAME:-v$(node -e 'console.log(require("./package.json").version)')}
          echo "Releasing assets for tag: $TAG_NAME"
          gh release view "$TAG_NAME" || gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes --prerelease=false
          gh release upload "$TAG_NAME" bin/niskava-linux-amd64 bin/niskava-linux-arm64 bin/niskava-darwin-amd64 bin/niskava-darwin-arm64 bin/niskava-windows-amd64.exe --clobber

      - name: Publish Package to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT_VER=$(node -e 'console.log(require("./package.json").version)')
          EXISTS=$(node -e "
            const { execSync } = require('child_process');
            try {
              const out = execSync('npm view @zyrexnns/niskava-agent versions --json', { encoding: 'utf8' });
              const versions = JSON.parse(out);
              const exists = Array.isArray(versions) ? versions.includes('$CURRENT_VER') : versions === '$CURRENT_VER';
              console.log(exists ? 'yes' : 'no');
            } catch (_) {
              console.log('no');
            }
          ")
          if [ "$EXISTS" = "yes" ]; then
            echo "Version $CURRENT_VER is already published on NPM. Skipping publish."
          else
            npm publish --access public || echo "Publish skipped or completed."
          fi
