[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "niskava-engine"
version = "0.1.0"
description = "Niskava Autonomous Financial Market Intelligence & Quant Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-v --strict-markers"
